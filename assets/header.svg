<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Engineering Data Into Intelligence. Sunil Kulali: Data Engineering, Analytics, Applied AI</title>
  <desc id="d">Scattered raw data points enter a pipeline, pass four stages, and emerge as ordered rising bars with one amber signal bar.</desc>
  <style>
    .m{font-family:'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .s{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
    .flow{stroke-dasharray:6 10;animation:dash 2.4s linear infinite}
    .blink{animation:blink 3.2s ease-in-out infinite}
    @keyframes dash{to{stroke-dashoffset:-32}}
    @keyframes blink{50%{opacity:.3}}
    @media (prefers-reduced-motion:reduce){.flow,.blink{animation:none}}
  </style>
  <rect width="1000" height="300" fill="#0B1020"/>
  <text x="40" y="30" class="m" font-size="13" fill="#94A3B8" letter-spacing="3">SUNIL KULALI</text>
  <text x="960" y="30" text-anchor="end" class="m" font-size="13" fill="#94A3B8" letter-spacing="3">BENGALURU · IN</text>
  <line x1="40" y1="42" x2="960" y2="42" stroke="#1E293B"/>

  <text x="40" y="120" class="s" font-size="46" font-weight="700" fill="#F8FAFC">Engineering Data Into <tspan fill="#22D3EE">Intelligence.</tspan></text>
  <text x="40" y="158" class="m" font-size="17" fill="#CBD5E1" letter-spacing="1">Data Engineering <tspan fill="#22D3EE">·</tspan> Analytics <tspan fill="#22D3EE">·</tspan> Applied AI</text>

  <g fill="#64748B">
    <circle cx="44" cy="214" r="3"/><circle cx="70" cy="252" r="3"/><circle cx="96" cy="226" r="3"/>
    <circle cx="118" cy="266" r="3"/><circle cx="142" cy="208" r="3"/><circle cx="160" cy="240" r="3"/>
    <circle cx="188" cy="268" r="3"/><circle cx="204" cy="222" r="3"/><circle cx="226" cy="250" r="3"/>
    <circle cx="244" cy="214" r="3"/><circle cx="262" cy="262" r="3"/><circle cx="60" cy="238" r="3"/>
  </g>
  <g fill="#94A3B8" class="blink">
    <circle cx="272" cy="236" r="3"/><circle cx="132" cy="284" r="2"/><circle cx="214" cy="198" r="2"/>
  </g>
  <path d="M280 240H300" stroke="#22D3EE" stroke-width="1.5"/>

  <rect x="300" y="222" width="400" height="36" rx="18" fill="none" stroke="#164E63" stroke-width="1.5"/>
  <path d="M400 222v36M500 222v36M600 222v36" stroke="#164E63"/>
  <path class="flow" d="M312 240H688" stroke="#22D3EE" stroke-width="2" fill="none"/>
  <g class="m" font-size="11" fill="#94A3B8" text-anchor="middle" letter-spacing="1">
    <text x="350" y="214">INGEST</text><text x="450" y="214">TRANSFORM</text>
    <text x="550" y="214">VALIDATE</text><text x="650" y="214">ANALYZE</text>
  </g>
  <path d="M700 240H730M724 234l7 6-7 6" stroke="#22D3EE" stroke-width="1.5" fill="none"/>

  <line x1="730" y1="272" x2="950" y2="272" stroke="#1E293B"/>
  <rect x="738" y="250" width="24" height="22" fill="#22D3EE" opacity=".35"/>
  <rect x="774" y="236" width="24" height="36" fill="#22D3EE" opacity=".45"/>
  <rect x="810" y="220" width="24" height="52" fill="#22D3EE" opacity=".55"/>
  <rect x="846" y="202" width="24" height="70" fill="#22D3EE" opacity=".7"/>
