<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Engineering system map</title>
  <desc id="d">Six numbered stages: 01 data sources, 02 ingestion, 03 transformation on the top row left to right, then 04 data quality, 05 analytics and AI, 06 decisions on the bottom row right to left.</desc>
  <style>
    .m{font-family:'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .node{fill:#0F172A;stroke:#1E293B}
    .flow{stroke-dasharray:4 6;animation:dash 2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-20}}
    @media (prefers-reduced-motion:reduce){.flow{animation:none}}
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4 0 8z" fill="#22D3EE"/></marker>
